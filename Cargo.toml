[workspace]
members = ["gnils-client", "gnils-protocol", "gnils-net"]
resolver = "3"

default-members = ["gnils-client"]

# getrandom is never referenced in code: it exists so rand's wasm32 backend
# gets the `wasm_js` feature (see the per-crate wasm dependencies).
[workspace.metadata.cargo-shear]
ignored = ["getrandom"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
