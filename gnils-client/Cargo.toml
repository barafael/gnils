[package]
name = "gnils"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
rand = "0.10"
gnils-protocol = { path = "../gnils-protocol" }
gnils-net = { path = "../gnils-net" }
uuid = "1"

# rand 0.10 → getrandom 0.4 requires explicit opt-in for wasm32.
# Kept for its features only (flagged unused by cargo shear).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }